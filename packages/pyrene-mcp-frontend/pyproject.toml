[project]
name = "pyrene-mcp-frontend"
version = "0.1.0"
description = "Streamlit frontend for invoking MCP tools through the Pyrene gateway (PRD-040)"
requires-python = ">=3.13"
# ADR-019 / F-15 — HTTP-only boundary: the package talks to gateway via httpx
# and never imports gateway/domain internal modules. ADR-025 amends this: the
# sole permitted `pyrene-*` dep is `pyrene-ui-common`, a leaf-utility package
# (httpx/streamlit only, zero domain dep) — not a service-layer cross-import.
dependencies = [
    "streamlit>=1.60.0",
    "httpx>=0.27",
    "cachetools>=5.3",
    "pendulum>=3.0",
    "jsonschema>=4.21",
    "pyrene-ui-common",
]

[project.scripts]
pyrene-mcp-frontend = "pyrene_mcp_frontend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_mcp_frontend"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
explicit_package_bases = true
namespace_packages = true

# Streamlit, cachetools ship partial stubs; ignore missing imports.
[[tool.mypy.overrides]]
module = [
    "streamlit",
    "streamlit.*",
    "streamlit.testing.*",
    "streamlit.testing.v1",
    "cachetools",
    "jsonschema",
    "jsonschema.*",
]
ignore_missing_imports = true

# Test files use heavy mocking; relax strict checks (mirrors dashboard).
[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true

# Streamlit pages are inherently dynamic (API dicts + widget calls).
[[tool.mypy.overrides]]
module = ["pyrene_mcp_frontend.pages.*"]
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
