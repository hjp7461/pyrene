[project]
name = "pyrene-ui-common"
version = "0.1.0"
description = "Shared leaf-utility helpers for Pyrene Streamlit frontends (ADR-025)"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.62.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_ui_common"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
explicit_package_bases = true
namespace_packages = true
# Streamlit / httpx ship partial stubs; ignore missing imports (dashboard mirror).
[[tool.mypy.overrides]]
module = [
    "streamlit",
    "streamlit.*",
    "streamlit.testing.*",
    "streamlit.testing.v1",
]
ignore_missing_imports = true

# Test files use heavy st mocking; relax strict checks (dashboard mirror).
[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
