[project]
name = "pyrene-gateway"
version = "0.1.0"
description = "Pyrene Phase 2: MCP gateway + hook chain backbone (PRD-009)"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pyrene-auth",
    "pyrene-agents",
    "pydantic>=2.7",
    "pydantic-ai>=1.93,<2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "cachetools>=5.3",
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_gateway"]

[tool.uv.sources]
pyrene-core = { workspace = true }
pyrene-auth = { workspace = true }
pyrene-agents = { workspace = true }
