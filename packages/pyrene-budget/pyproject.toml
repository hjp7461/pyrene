[project]
name = "pyrene-budget"
version = "0.1.0"
description = "Pyrene Phase 2: Budget limits + fail-closed pre/post hooks (PRD-014)"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pyrene-auth",
    "pyrene-gateway",
    "pyrene-metering",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "cachetools>=5.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_budget"]

[tool.uv.sources]
pyrene-core = { workspace = true }
pyrene-auth = { workspace = true }
pyrene-gateway = { workspace = true }
pyrene-metering = { workspace = true }
