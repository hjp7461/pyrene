[project]
name = "pyrene-core"
version = "0.1.0"
description = "Pyrene shared abstractions: BaseModel base, UserContext, common types"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    # PRD-006 / PLAN-006 — observability is shared across packages so the
    # configure helper lives in core. Logfire vendors its own OTel SDK.
    # PRD-036: `[httpx]` extra previously came in transitively via the
    # `pydantic-ai` meta-package; after switching to `pydantic-ai-slim`
    # we declare it explicitly so the httpx fallback path in
    # `logfire_setup` (when `instrument_pydantic_ai` is unavailable)
    # remains functional.
    "logfire[httpx]>=4.0",
    "opentelemetry-sdk>=1.27",
    # SQLAlchemy instrumentation isn't strictly needed by core, but the
    # `instrument_sqlalchemy` helper inside `logfire_setup` calls into
    # opentelemetry-instrumentation-sqlalchemy. Pin it here so a fresh
    # `uv sync` populates the wheel; pyrene-sql is the actual user.
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_core"]
