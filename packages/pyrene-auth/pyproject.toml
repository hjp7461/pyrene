[project]
name = "pyrene-auth"
version = "0.1.0"
description = "Pyrene Phase 2 backbone: User / Team / Role + JWT auth (PRD-007)"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic[email]>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "argon2-cffi>=23.0",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
]

[project.scripts]
pyrene-auth = "pyrene_auth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_auth"]

[tool.uv.sources]
pyrene-core = { workspace = true }
