[project]
name = "pyrene-data-rbac"
version = "0.1.0"
description = "Pyrene Phase 2: Data-level RBAC (Role x Connection x Schema x Table matrix) — PRD-011 / PLAN-011"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pyrene-auth",
    "pyrene-rbac",
    "pyrene-gateway",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "cachetools>=7.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_data_rbac"]

[tool.uv.sources]
pyrene-core = { workspace = true }
pyrene-auth = { workspace = true }
pyrene-rbac = { workspace = true }
pyrene-gateway = { workspace = true }
