[project]
name = "pyrene-audit"
version = "0.1.0"
description = "Pyrene Phase 2: WORM audit log + per-team hash chain (PRD-015)"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pyrene-auth",
    "pyrene-gateway",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_audit"]

[tool.uv.sources]
pyrene-core = { workspace = true }
pyrene-auth = { workspace = true }
pyrene-gateway = { workspace = true }
