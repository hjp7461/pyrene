[project]
name = "pyrene-mcp-tools"
version = "0.1.0"
description = "Pyrene Phase 2: Filesystem + GitHub MCP tool wrappers (PRD-012 / PLAN-012)"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pyrene-gateway",
    "pydantic>=2.7",
    "anyio>=4.0",
    "mcp>=1.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_mcp_tools"]

[tool.uv.sources]
pyrene-core = { workspace = true }
pyrene-gateway = { workspace = true }
