[project]
name = "pyrene-metering"
version = "0.1.0"
description = "Pyrene Phase 2: Cost metering — token × price → usage_records (PRD-013)"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pyrene-auth",
    "pyrene-gateway",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[anthropic,openai]>=1.93,<2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "fastapi>=0.111",
    "cachetools>=5.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_metering"]

[tool.uv.sources]
pyrene-core = { workspace = true }
pyrene-auth = { workspace = true }
pyrene-gateway = { workspace = true }
