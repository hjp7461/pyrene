[project]
name = "pyrene-sql"
version = "0.1.0"
description = "Pyrene Phase 1: Pydantic AI SQL analyst over PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "pyrene-core",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "pydantic-ai-slim[anthropic,openai]>=1.93,<2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
pyrene-sql = "pyrene_sql.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrene_sql"]

[tool.uv.sources]
pyrene-core = { workspace = true }
