; Pyrene Alembic global config (ADR-013 (a)).
;
; Single repo-root config. `migrations/env.py` combines metadata from every
; workspace package that owns DB tables (currently: pyrene-auth; future:
; pyrene-agent-registry, pyrene-audit, pyrene-cost, pyrene-sql).
;
; The migration chain is single-linear (`down_revision` always points to the
; previous file). Parallel PR conflicts are resolved by rebase + revision
; reassignment, not `alembic merge` (ADR-013 (a)).
;
; DSN: read from env var `PG_DSN` at runtime (see migrations/env.py).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
