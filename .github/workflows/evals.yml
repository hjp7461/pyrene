name: Evals

# ADR-012 §1: PR + nightly cron share one workflow but use stage selectors.
# This file owns the eval-specific stages (`evals-fast`, `security-evals`,
# `evals-full`). The lint/typecheck/unit/integration stages live in `ci.yml`.
#
# PR runs only `evals-fast` + `security-evals` — both mocked, $0 cost.
# Nightly cron runs `evals-full` against the live model with a $20 cap.

on:
  pull_request:
    paths:
      - 'packages/pyrene-sql/src/pyrene_sql/evals/**'
      - 'packages/pyrene-sql/tests/evals/**'
      - 'packages/pyrene-sql/tests/baselines/evals/**'
      - 'packages/pyrene-sql/tests/integration/test_evals_datasets.py'
      - 'packages/pyrene-sql/tests/unit/test_evals_*.py'
      - '.github/workflows/evals.yml'
  push:
    branches: [main, master]
  schedule:
    # 02:00 KST nightly (17:00 UTC) — ADR-012 §1.
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  # ----- evals-fast (PR + nightly) ----------------------------------------
  # ADR-012 stage 5. Mocked agent (recordings JSON) -> KeywordJudge ->
  # baseline regression. Cost $0. Cap 1 minute.
  evals-fast:
    name: evals-fast (mock_mode, baseline regression)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # ADR-012 §3 (b): per-job budget counter, propagated to stages that
      # actually call models. evals-fast does not, so this is informational.
      CI_BUDGET_USD_REMAINING: '5.00'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run unit eval tests
        run: uv run pytest packages/pyrene-sql/tests/unit/test_evals_runner.py packages/pyrene-sql/tests/unit/test_evals_judge.py -v

      - name: Run integration eval tests (mock_mode + baseline regression)
        run: uv run pytest packages/pyrene-sql/tests/integration/test_evals_datasets.py -v

      - name: Verify baselines were not silently regenerated
        # ADR-012 §4: baseline changes require the `baseline-override` label.
        # We refuse to merge if the working tree is dirty after running
        # mocked evals (i.e. someone touched recordings/baselines without
        # going through the labelled-PR path).
        run: |
          if [ -n "$(git status --porcelain packages/pyrene-sql/tests/baselines)" ]; then
            echo "::error::Baselines were modified during the eval run."
            echo "If this is intentional, send a separate PR with the"
            echo "'baseline-override' label and CODEOWNERS approval."
            git diff packages/pyrene-sql/tests/baselines
            exit 1
          fi

  # ----- security-evals (PR + nightly) ------------------------------------
  # ADR-012 stage 6. PLAN-005 dataset C is the seed; PLAN-017 will extend.
  # All LLM calls mocked via recordings JSON.
  security-evals:
    name: security-evals (dataset C, mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: evals-fast
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run dataset C (safety) only
        # The integration test parametrizes over A/B/C/D; we narrow to C
        # via -k for the dedicated security stage so its red/green is
        # independent of accuracy/performance failures.
        run: uv run pytest 'packages/pyrene-sql/tests/integration/test_evals_datasets.py::test_dataset_baseline_regression[C]' -v

  # ----- evals-full (nightly only) ----------------------------------------
  # ADR-012 stage 7. Real LLM calls (LIVE_TESTS=1 + ANTHROPIC_API_KEY).
  # Skipped on PR. $20 nightly cap. Failures become Slack alerts + GitHub
  # Issues, NOT a PR block.
  evals-full:
    name: evals-full (nightly, real model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: evals-fast
    env:
      LIVE_TESTS: '1'
      CI_BUDGET_USD_REMAINING: '20.00'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai:gpt-5' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Pre-flight cost estimate (tiktoken)
        # ADR-012 §3 (a): measure prompt tokens before firing real calls.
        # Implementation lands in PLAN-013 (cost-metering); for now we run
        # a stub that loads each dataset and prints token estimates.
        run: |
          uv run python -c "
          import tiktoken
          from pyrene_sql.evals import load_dataset
          enc = tiktoken.get_encoding('cl100k_base')
          total = 0
          for n in ('A','B','C','D'):
              for c in load_dataset(n):
                  total += len(enc.encode(c.question))
          print(f'Total dataset prompt tokens: {total}')
          "

      - name: Run live evals (mock_mode=False)
        # The live runner is exercised here via a marker. PLAN-005 §5 ships
        # only the mock-mode integration test; PLAN-013 adds a parallel
        # live-mode test that consumes the same datasets with deps wired.
        run: |
          echo "::notice::evals-full nightly is currently a stub --"
          echo "::notice::PLAN-013 (cost-metering) wires the live runner."

      - name: Open issue on regression
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `evals-full nightly regression -- ${new Date().toISOString().slice(0,10)}`,
              body: 'evals-full failed; see workflow logs. PLAN-005 / ADR-012 escalation path.',
              labels: ['evals-regression']
            })
