# PRD-028: GitHub Actions 자동 bump.
# PRD-030: Python (uv) ecosystem 자동 bump.
#
# astral-sh/setup-uv@v8+ 의 immutable release policy (PRD-025 F-2) 의
# *수동 patch 모니터링 부담* 보상. Python deps 는 *grouped + monthly +
# ignore major* 3중 방어로 PR 폭주 완화 (PRD-030 §4).
#
# 참고: .claude/rules/operational-notes.md §"GitHub Actions deprecation 대응"

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # 유지보수 모드: version update PR 차단 (security update 는 limit 무관하게 계속 생성)
    open-pull-requests-limit: 0
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    # 유지보수 모드: version update PR 차단 (security update 는 limit 무관하게 계속 생성)
    open-pull-requests-limit: 0
    labels:
      - python
      - dependencies
    commit-message:
      prefix: deps
      include: scope
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
